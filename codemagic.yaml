# Codemagic Configuration for Kyvra Android Build
workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Repair Gradle Wrapper
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          cd android
          if command -v gradle &> /dev/null; then
            echo "Gradle is installed. Regenerating wrapper..."
            gradle wrapper --gradle-version 8.14.3
          else
            echo "Gradle not found. Downloading wrapper jar via LFS-resolved endpoint..."
            cd gradle/wrapper
            curl -sSL -o gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Build Android APK
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
