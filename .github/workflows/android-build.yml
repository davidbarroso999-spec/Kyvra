name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Instalar Dependências Web
        run: |
          npm install --legacy-peer-deps

      - name: Compilar Aplicação Web (Vite + React)
        run: |
          npm run build

      - name: Sincronizar Projeto Android (Capacitor Sync)
        run: |
          npx cap sync android

      - name: Garantir Permissões e Validar Gradle Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          if ! ./gradlew --version >/dev/null 2>&1; then
            echo "Regenerando Gradle Wrapper limpo via Gradle 8.5..."
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi
          ./gradlew --version
          cd ..

      - name: Compilar APK Android (Debug Universal)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar Artefato com Nome Amigável
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Kyvra-Player-Android.apk

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Kyvra-Player-Android-APK
          path: build-output/Kyvra-Player-Android.apk
          retention-days: 30

      - name: Resumo do Build
        run: |
          echo "### 🎵 Kyvra APK Android compilado com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Arquivo:** \`Kyvra-Player-Android.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibilidade:** Android 7.0 (Nougat) até Android 15" >> $GITHUB_STEP_SUMMARY
          echo "- **Recursos:** Player em segundo plano, MediaSession na barra de notificações, controles de fone de ouvido e cache local." >> $GITHUB_STEP_SUMMARY
          echo "- **Como baixar:** Vá na seção **Artifacts** abaixo e baixe o arquivo para instalar direto no seu celular." >> $GITHUB_STEP_SUMMARY


