name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Gradle wrapper JAR exists
        shell: bash
        run: |
          wrapper_jar="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -s "$wrapper_jar" ]; then
            curl --fail --location --silent --show-error \
              https://github.com/gradle/gradle/raw/v8.14.3/gradle/wrapper/gradle-wrapper.jar \
              --output "$wrapper_jar"
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build installable debug APK
        run: android/gradlew assembleDebug --stacktrace

      - name: Prepare release signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/kyvra-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "KYVRA_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "KYVRA_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          KYVRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KYVRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KYVRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kyvra-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyvra-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
